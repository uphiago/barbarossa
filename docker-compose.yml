# barbarossa — docker compose
# Three-phase operation: CHARLIE (collect) + OSCAR (operate) + PAPA (persist)
#
# Internal network: barbarossa-net
#   charlie ↔ hermes  (via SSH, internal port 22)
#   host    → charlie (via SSH, mapped port 2222)
#   Telegram → hermes (gateway)
#

services:
  # ─── CHARLIE: collect, coverage, cartography ───
  charlie:
    build:
      context: ./workers/charlie
    container_name: charlie
    hostname: charlie
    restart: unless-stopped
    ports:
      - "2222:22"
    volumes:
      - ./worker/ssh-keys/authorized_keys:/ssh-keys/authorized_keys:ro
      - charlie-data:/root
      - hermes-data:/hermes
    environment:
      - TZ=America/Sao_Paulo
    networks:
      - barbarossa-net

  # ─── Hermes: agent + gateway ───
  hermes:
    build:
      context: ./hermes-agent
    container_name: hermes
    hostname: hermes
    restart: unless-stopped
    command: gateway run
    depends_on:
      - charlie
    ports:
      - "127.0.0.1:9119:9119"
    volumes:
      - hermes-data:/opt/data
    env_file:
      - .env
    environment:
      - TZ=America/Sao_Paulo
      - TERMINAL_ENV=ssh
      - TERMINAL_SSH_HOST=charlie
      - TERMINAL_SSH_PORT=22
      - TERMINAL_SSH_USER=root
      - TERMINAL_SSH_KEY=/opt/data/ssh/key
      - HERMES_DASHBOARD=1
      - HERMES_DASHBOARD_BASIC_AUTH_USERNAME=${DASHBOARD_USER:-admin}
      - HERMES_DASHBOARD_BASIC_AUTH_PASSWORD=${DASHBOARD_PASS:-barbarossa}
      - HERMES_DASHBOARD_BASIC_AUTH_SECRET=${DASHBOARD_SECRET:-barbarossa-dashboard-secret-change-me}
    networks:
      - barbarossa-net

networks:
  barbarossa-net:
    driver: bridge

volumes:
  charlie-data:
  hermes-data:

# barbarossa — docker compose
# CHARLIE (collect) + OSCAR (operate) + PAPA (persist)
# 4GB VPS — todos rodam simultaneamente
#
# Local dev:   docker compose up -d --build
# VPS deploy:  docker compose pull && docker compose up -d
#
# Rede interna: barbarossa-net
#   charlie ↔ hermes (SSH)  |  oscar ↔ hermes (SSH)  |  papa ↔ hermes (SSH)
#   host → charlie (SSH, :2222)  |  Telegram → hermes (gateway)

services:
  charlie:
    image: ghcr.io/uphiago/barbarossa-charlie:latest
    build:
      context: .
      dockerfile: workers/charlie/Dockerfile
    container_name: charlie
    hostname: charlie
    restart: unless-stopped
    mem_limit: 1g
    pids_limit: 512
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "127.0.0.1:2222:22"
    volumes:
      - ${BARBAROSSA_AUTHORIZED_KEYS_FILE:?set BARBAROSSA_AUTHORIZED_KEYS_FILE}:/ssh-keys/authorized_keys:ro
      - charlie-data:/root
      - charlie-ssh:/ssh-host-keys
      - hermes-data:/hermes
    environment:
      - TZ=America/Sao_Paulo
    networks:
      - barbarossa-net
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 22"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  oscar:
    image: ghcr.io/uphiago/barbarossa-oscar:latest
    build:
      context: .
      dockerfile: workers/oscar/Dockerfile
    container_name: oscar
    hostname: oscar
    restart: unless-stopped
    mem_limit: 1g
    pids_limit: 512
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ${BARBAROSSA_AUTHORIZED_KEYS_FILE:?set BARBAROSSA_AUTHORIZED_KEYS_FILE}:/ssh-keys/authorized_keys:ro
      - oscar-data:/root/output
      - oscar-ssh:/ssh-host-keys
    environment:
      - TZ=America/Sao_Paulo
    networks:
      - barbarossa-net
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 22"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  papa:
    image: ghcr.io/uphiago/barbarossa-papa:latest
    build:
      context: .
      dockerfile: workers/papa/Dockerfile
    container_name: papa
    hostname: papa
    restart: unless-stopped
    mem_limit: 512m
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ${BARBAROSSA_AUTHORIZED_KEYS_FILE:?set BARBAROSSA_AUTHORIZED_KEYS_FILE}:/ssh-keys/authorized_keys:ro
      - papa-data:/root/output
      - papa-ssh:/ssh-host-keys
      - papa-tor:/var/lib/tor
    environment:
      - TZ=America/Sao_Paulo
    networks:
      - barbarossa-net
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          nc -z 127.0.0.1 22 &&
          curl --socks5-hostname 127.0.0.1:9050 -fsS --max-time 20
          https://check.torproject.org/api/ip | grep -q '"IsTor":true'
      interval: 60s
      timeout: 25s
      retries: 5
      start_period: 180s

  hermes:
    image: nousresearch/hermes-agent:latest
    container_name: hermes
    hostname: hermes
    restart: unless-stopped
    mem_limit: 1g
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    command: gateway run
    depends_on:
      charlie:
        condition: service_healthy
      oscar:
        condition: service_healthy
      papa:
        condition: service_healthy
    ports:
      - "127.0.0.1:9119:9119"
    volumes:
      - hermes-data:/opt/data
    env_file:
      - .env
    environment:
      - TZ=America/Sao_Paulo
      - TERMINAL_ENV=ssh
      - TERMINAL_SSH_HOST=charlie
      - TERMINAL_SSH_PORT=22
      - TERMINAL_SSH_USER=root
      - TERMINAL_SSH_KEY=/opt/data/ssh/key
      - HERMES_DASHBOARD=1
      - HERMES_DASHBOARD_BASIC_AUTH_USERNAME=${DASHBOARD_USER:?set DASHBOARD_USER}
      - HERMES_DASHBOARD_BASIC_AUTH_PASSWORD=${DASHBOARD_PASS:?set DASHBOARD_PASS}
      - HERMES_DASHBOARD_BASIC_AUTH_SECRET=${DASHBOARD_SECRET:?set DASHBOARD_SECRET}
    networks:
      - barbarossa-net
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS --max-time 5
          -u "$$HERMES_DASHBOARD_BASIC_AUTH_USERNAME:$$HERMES_DASHBOARD_BASIC_AUTH_PASSWORD"
          http://127.0.0.1:9119/ >/dev/null
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

networks:
  barbarossa-net:
    driver: bridge

volumes:
  charlie-data:
  charlie-ssh:
  oscar-data:
  oscar-ssh:
  papa-data:
  papa-ssh:
  papa-tor:
  hermes-data:

# Hermes first-run config (applied once via setup.sh or manually):
#   hermes config set terminal.backend ssh
#   hermes config set model.provider deepseek
#   hermes config set model.name deepseek/deepseek-v4-flash
#   hermes config set model.default deepseek/deepseek-v4-flash

name: barbarossa

x-service-defaults: &service-defaults
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  forge:
    <<: *service-defaults
    image: ghcr.io/uphiago/barbarossa-forge:${BARBAROSSA_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: containers/forge/Dockerfile
    hostname: forge
    read_only: true
    mem_limit: 1408m
    pids_limit: 384
    cpus: 1.50
    cpu_shares: 1024
    environment:
      TZ: America/Sao_Paulo
      WORKER_USER: forge
      WORKER_KIND: forge
      WORKER_HOME: /home/forge
      WORKSPACE_ROOT: /workspace
      CODEX_HOME: /home/forge/.codex
    secrets:
      - source: worker_authorized_keys
        target: worker_authorized_keys
      - source: codex_access_token
        target: codex_access_token
      - source: codex_auth_json
        target: codex_auth_json
    volumes:
      - forge-workspace:/workspace
      - forge-codex-home:/home/forge/.codex
      - forge-host-keys:/ssh-host-keys
      - ./config/codex/config.toml:/usr/local/share/barbarossa/codex/config.toml:ro
      - ./skills/codex/barbarossa-artifacts/SKILL.md:/usr/local/share/barbarossa/codex/SKILL.md:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m
      - /run:rw,nosuid,nodev,size=16m
      - /home/forge/.ssh:rw,noexec,nosuid,nodev,size=1m,uid=10001,gid=10001,mode=0700
    networks:
      - hermes-forge
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - import socket; socket.create_connection(("127.0.0.1", 22), 3).close()
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s

  recon:
    <<: *service-defaults
    image: ghcr.io/uphiago/barbarossa-recon:${BARBAROSSA_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: containers/recon/Dockerfile
    hostname: recon
    read_only: true
    mem_limit: 640m
    pids_limit: 256
    cpus: 1.00
    cpu_shares: 256
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      TZ: America/Sao_Paulo
      WORKER_USER: recon
      WORKER_KIND: recon
      WORKER_HOME: /home/recon
      WORKSPACE_ROOT: /workspace
    secrets:
      - source: worker_authorized_keys
        target: worker_authorized_keys
    volumes:
      - recon-workspace:/workspace
      - recon-tor-state:/var/lib/tor
      - recon-host-keys:/ssh-host-keys
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m
      - /run:rw,nosuid,nodev,size=16m
      - /home/recon/.ssh:rw,noexec,nosuid,nodev,size=1m,uid=10002,gid=10002,mode=0700
    networks:
      - hermes-recon
    healthcheck:
      test:
        - CMD-SHELL
        - nc -z 127.0.0.1 22 && nc -z 127.0.0.1 9050
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  hermes:
    <<: *service-defaults
    image: nousresearch/hermes-agent@sha256:545ef5a71b52b63aab08e29721701681d64465594ae5ffe7e860a8a758da0371
    hostname: hermes
    mem_limit: 1024m
    pids_limit: 256
    cpus: 1.00
    cpu_shares: 512
    depends_on:
      forge:
        condition: service_healthy
      recon:
        condition: service_healthy
    command:
      - sh
      - -lc
      - >-
        /opt/hermes/.venv/bin/python /opt/barbarossa/configure.py &&
        exec /opt/hermes/.venv/bin/python
        /opt/barbarossa/gateway_entrypoint.py gateway run
    ports:
      - "${HERMES_DASHBOARD_BIND:-127.0.0.1}:${HERMES_DASHBOARD_PORT:-9119}:9119"
    environment:
      TZ: America/Sao_Paulo
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?set DEEPSEEK_API_KEY}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?set TELEGRAM_BOT_TOKEN}
      TELEGRAM_ALLOWED_USERS: ${TELEGRAM_ALLOWED_USERS:-}
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: ${DASHBOARD_USER:?set DASHBOARD_USER}
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: ${DASHBOARD_PASS:?set DASHBOARD_PASS}
      HERMES_DASHBOARD_BASIC_AUTH_SECRET: ${DASHBOARD_SECRET:?set DASHBOARD_SECRET}
      BARBAROSSA_SSH_KEY: /run/secrets/worker_key
      BARBAROSSA_KNOWN_HOSTS: /run/secrets/known_hosts
      BARBAROSSA_STATE_DB: /opt/data/router/jobs.sqlite3
      BARBAROSSA_INPUT_ROOT: /opt/data/barbarossa-transfer
      BARBAROSSA_RESULT_ROOT: /opt/data/barbarossa-results
      BARBAROSSA_FORGE_HOST: forge
      BARBAROSSA_RECON_HOST: recon
      OTEL_SDK_DISABLED: "true"
    secrets:
      - source: worker_private_key
        target: worker_key
      - source: worker_known_hosts
        target: known_hosts
    volumes:
      - hermes-state:/opt/data
      - ${BARBAROSSA_ROUTER_BUNDLE:?set BARBAROSSA_ROUTER_BUNDLE}:/opt/barbarossa-router/barbarossa-router.pex:ro
      - ./config/hermes/configure.py:/opt/barbarossa/configure.py:ro
      - ./config/hermes/gateway_entrypoint.py:/opt/barbarossa/gateway_entrypoint.py:ro
      - ./AGENTS.md:/opt/barbarossa/context/AGENTS.md:ro
      - ./skills/hermes/barbarossa-routing:/opt/barbarossa/context/skills/barbarossa-routing:ro
      - ./skills/hermes/barbarossa-codex:/opt/barbarossa/context/skills/barbarossa-codex:ro
      - ./skills/hermes/barbarossa-network:/opt/barbarossa/context/skills/barbarossa-network:ro
    networks:
      - hermes-forge
      - hermes-recon
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS --max-time 5
          -u "$$HERMES_DASHBOARD_BASIC_AUTH_USERNAME:$$HERMES_DASHBOARD_BASIC_AUTH_PASSWORD"
          http://127.0.0.1:9119/ >/dev/null
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s

networks:
  hermes-forge:
    driver: bridge
  hermes-recon:
    driver: bridge

volumes:
  hermes-state:
  forge-workspace:
  forge-codex-home:
  forge-host-keys:
  recon-workspace:
  recon-tor-state:
  recon-host-keys:

secrets:
  worker_private_key:
    file: ${BARBAROSSA_WORKER_SSH_KEY_FILE:?set BARBAROSSA_WORKER_SSH_KEY_FILE}
  worker_authorized_keys:
    file: ${BARBAROSSA_AUTHORIZED_KEYS_FILE:?set BARBAROSSA_AUTHORIZED_KEYS_FILE}
  worker_known_hosts:
    file: ${BARBAROSSA_KNOWN_HOSTS_FILE:?set BARBAROSSA_KNOWN_HOSTS_FILE}
  codex_access_token:
    file: ${BARBAROSSA_CODEX_TOKEN_FILE:?set BARBAROSSA_CODEX_TOKEN_FILE}
  codex_auth_json:
    file: ${BARBAROSSA_CODEX_AUTH_FILE:?set BARBAROSSA_CODEX_AUTH_FILE}

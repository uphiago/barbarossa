name: Build and deploy Barbarossa

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

concurrency:
  group: barbarossa-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/uphiago/barbarossa

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@1e862dfacbd1d6d858c55d9b792c756523627244 # v7.1.4
        with:
          version: "0.12.13"
          enable-cache: true
      - name: Test router
        working-directory: router
        run: |
          uv sync --frozen
          uv run pytest -q
      - name: Test worker RPC and infrastructure
        run: |
          uv run --with pytest==9.1.1 --with pyyaml==6.0.3 \
            pytest tests/test-worker-rpc.py tests/test-hermes-configure.py tests/test-hermes-gateway.py tests/test-deploy-runtime.py -q
          tests/test-hermes-secret-stage.sh
          uv run --with pyyaml==6.0.3 bash tests/infra-regression.sh
      - name: Test Hermes gateway in the pinned image
        run: |
          export BARBAROSSA_HERMES_TEST_IMAGE="$(uv run --with pyyaml==6.0.3 python -c 'import yaml; print(yaml.safe_load(open("docker-compose.yml"))["services"]["hermes"]["image"])')"
          tests/hermes-image-integration.sh
      - name: Validate Compose
        run: |
          runtime="$(mktemp -d)"
          trap 'rm -rf "$runtime"' EXIT
          touch "$runtime/key" "$runtime/authorized_keys" \
            "$runtime/known_hosts" "$runtime/codex_access_token" \
            "$runtime/codex_auth.json" "$runtime/github_token" \
            "$runtime/router.pex"
          cp hermes.env.example "$runtime/hermes.env"
          BARBAROSSA_RUNTIME_DIR="$runtime" \
          BARBAROSSA_HERMES_ENV_FILE="$runtime/hermes.env" \
          BARBAROSSA_CODEX_AUTH_FILE="$runtime/codex_auth.json" \
          BARBAROSSA_GITHUB_TOKEN_FILE="$runtime/github_token" \
            docker compose --env-file .env.example config --quiet
  build-router:
    needs: validate
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@1e862dfacbd1d6d858c55d9b792c756523627244 # v7.1.4
        with:
          version: "0.12.13"
          enable-cache: true
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build PEX
        working-directory: router
        run: |
          mkdir -p dist
          uv export --quiet --frozen --no-dev --no-emit-project \
            --format requirements-txt \
            --output-file dist/runtime-requirements.txt
          uv run --frozen --group bundle pex \
            -r dist/runtime-requirements.txt \
            -D src \
            -o dist/barbarossa-router.pex \
            --python-shebang=/opt/hermes/.venv/bin/python \
            -e barbarossa_router.cli:main
          BARBAROSSA_ROUTER_PEX="$PWD/dist/barbarossa-router.pex" \
          BARBAROSSA_ROUTER_PYTHON="$(command -v python3)" \
            uv run pytest tests/test_packaged_server.py -q
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: router
          file: router/Containerfile.bundle
          push: true
          tags: |
            ghcr.io/uphiago/barbarossa-router-bundle:${{ github.sha }}
            ghcr.io/uphiago/barbarossa-router-bundle:latest

  build-workers:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - worker: forge
            image: barbarossa-forge
            dockerfile: containers/forge/Dockerfile
          - worker: recon
            image: barbarossa-recon
            dockerfile: containers/recon/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - if: >-
          github.event_name == 'workflow_dispatch' ||
          startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          tags: |
            ghcr.io/uphiago/${{ matrix.image }}:${{ github.sha }}
            ghcr.io/uphiago/${{ matrix.image }}:latest
      - name: Test the built worker image
        env:
          BARBAROSSA_FORGE_TEST_IMAGE: ghcr.io/uphiago/barbarossa-forge:${{ github.sha }}
          BARBAROSSA_RECON_TEST_IMAGE: ghcr.io/uphiago/barbarossa-recon:${{ github.sha }}
        run: tests/container-integration.sh "${{ matrix.worker }}"
      - name: Publish tested worker image
        if: >-
          github.event_name == 'workflow_dispatch' ||
          startsWith(github.ref, 'refs/tags/v')
        run: |
          docker push "ghcr.io/uphiago/${{ matrix.image }}:${GITHUB_SHA}"
          docker push "ghcr.io/uphiago/${{ matrix.image }}:latest"

  deploy:
    needs: [validate, build-router, build-workers]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure verified OVH SSH
        env:
          OVH_HOST_KEY: ${{ secrets.OVH_HOST_KEY }}
          OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
        run: |
          set -eu
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$OVH_HOST_KEY" > "$HOME/.ssh/known_hosts"
          printf '%s\n' "$OVH_SSH_KEY" > "$HOME/.ssh/ovh"
          chmod 0600 "$HOME/.ssh/known_hosts" "$HOME/.ssh/ovh"
          ssh-keygen -l -f "$HOME/.ssh/known_hosts"
      - name: Upload reviewed source
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_USER: ${{ secrets.OVH_USER }}
        run: |
          set -eu
          remote="${OVH_USER}@${OVH_HOST}"
          ssh -i "$HOME/.ssh/ovh" -o StrictHostKeyChecking=yes \
            "$remote" \
            "install -d -m 0750 \"\$HOME/barbarossa-releases/${GITHUB_SHA}\""
          git archive "${GITHUB_SHA}" |
            ssh -i "$HOME/.ssh/ovh" -o StrictHostKeyChecking=yes \
              "$remote" "tar -x -C \"\$HOME/barbarossa-releases/${GITHUB_SHA}\" && ln -sfn \"\$HOME/barbarossa/.env\" \"\$HOME/barbarossa-releases/${GITHUB_SHA}/.env\" && ln -sfn \"\$HOME/barbarossa/hermes.env\" \"\$HOME/barbarossa-releases/${GITHUB_SHA}/hermes.env\""
      - name: Authenticate registry
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_USER: ${{ secrets.OVH_USER }}
        run: |
          set -eu
          printf '%s' "$GHCR_PAT" |
            ssh -i "$HOME/.ssh/ovh" -o StrictHostKeyChecking=yes \
              "${OVH_USER}@${OVH_HOST}" \
              'docker login ghcr.io -u uphiago --password-stdin >/dev/null'
      - name: Install worker credentials
        env:
          CODEX_ACCESS_TOKEN: ${{ secrets.CODEX_ACCESS_TOKEN }}
          CODEX_AUTH_JSON_B64: ${{ secrets.CODEX_AUTH_JSON_B64 }}
          BARBAROSSA_GITHUB_TOKEN: ${{ secrets.BARBAROSSA_GITHUB_TOKEN }}
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_USER: ${{ secrets.OVH_USER }}
        run: |
          set -eu
          if [ -n "$CODEX_ACCESS_TOKEN" ]; then
            printf '%s' "$CODEX_ACCESS_TOKEN" |
              ssh -i "$HOME/.ssh/ovh" -o StrictHostKeyChecking=yes \
                "${OVH_USER}@${OVH_HOST}" \
                'umask 077; install -d -m 0700 "$HOME/.config/barbarossa/runtime"; if [ -s "$HOME/.config/barbarossa/runtime/codex_access_token" ]; then cat >/dev/null; else cat > "$HOME/.config/barbarossa/runtime/codex_access_token"; fi'
          fi
          if [ -n "$CODEX_AUTH_JSON_B64" ]; then
            printf '%s' "$CODEX_AUTH_JSON_B64" | base64 --decode |
              ssh -i "$HOME/.ssh/ovh" -o StrictHostKeyChecking=yes \
                "${OVH_USER}@${OVH_HOST}" \
                'umask 077; install -d -m 0700 "$HOME/.config/barbarossa/runtime"; if [ -s "$HOME/.config/barbarossa/runtime/codex_auth.json" ]; then cat >/dev/null; else cat > "$HOME/.config/barbarossa/runtime/codex_auth.json"; fi'
          fi
          if [ -n "$BARBAROSSA_GITHUB_TOKEN" ]; then
            printf '%s' "$BARBAROSSA_GITHUB_TOKEN" |
              ssh -i "$HOME/.ssh/ovh" -o StrictHostKeyChecking=yes \
                "${OVH_USER}@${OVH_HOST}" \
                'umask 077; install -d -m 0700 "$HOME/.config/barbarossa/runtime"; if [ -s "$HOME/.config/barbarossa/runtime/github_token" ]; then cat >/dev/null; else cat > "$HOME/.config/barbarossa/runtime/github_token"; fi'
          fi
      - name: Cut over and smoke test
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_USER: ${{ secrets.OVH_USER }}
        run: |
          set -eu
          ssh -i "$HOME/.ssh/ovh" -o StrictHostKeyChecking=yes \
            "${OVH_USER}@${OVH_HOST}" \
            "cd \"\$HOME/barbarossa-releases/${GITHUB_SHA}\" && BARBAROSSA_IMAGE_TAG='${GITHUB_SHA}' scripts/deploy-runtime-files.sh"

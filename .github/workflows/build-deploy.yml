name: Build & Deploy Workers

on:
  push:
    branches: [main]
    paths:
      - 'workers/**'
      - 'docker-compose.yml'
      - '.github/workflows/build-deploy.yml'

jobs:
  # ─── Detect which workers changed ───
  changes:
    runs-on: ubuntu-latest
    outputs:
      charlie: ${{ steps.filter.outputs.charlie }}
      oscar: ${{ steps.filter.outputs.oscar }}
      papa: ${{ steps.filter.outputs.papa }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            charlie:
              - 'workers/charlie/**'
              - 'workers/shared/**'
            oscar:
              - 'workers/oscar/**'
              - 'workers/shared/**'
            papa:
              - 'workers/papa/**'
              - 'workers/shared/**'

  # ─── Build & push each changed worker ───
  build:
    needs: changes
    runs-on: ubuntu-latest
    if: needs.changes.outputs.charlie == 'true' || needs.changes.outputs.oscar == 'true' || needs.changes.outputs.papa == 'true'
    strategy:
      matrix:
        worker: [charlie, oscar, papa]
        exclude:
          - worker: charlie
            build: ${{ needs.changes.outputs.charlie != 'true' }}
          - worker: oscar
            build: ${{ needs.changes.outputs.oscar != 'true' }}
          - worker: papa
            build: ${{ needs.changes.outputs.papa != 'true' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push ${{ matrix.worker }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: workers/${{ matrix.worker }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/barbarossa-${{ matrix.worker }}:latest
            ghcr.io/${{ github.repository_owner }}/barbarossa-${{ matrix.worker }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── SSH deploy to OVH ───
  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: success()
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to OVH VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.OVH_HOST }}
          username: ${{ secrets.OVH_USER }}
          key: ${{ secrets.OVH_SSH_KEY }}
          script: |
            cd ~/barbarossa
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull charlie oscar papa
            docker compose up -d --remove-orphans
            docker image prune -f

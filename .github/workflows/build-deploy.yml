name: Build & Deploy Workers

on:
  push:
    branches: [main]
    paths:
      - 'workers/**'
      - 'docker-compose.yml'
      - '.github/workflows/build-deploy.yml'

jobs:
  # ─── Detect which workers changed ───
  changes:
    runs-on: ubuntu-latest
    outputs:
      charlie: ${{ steps.filter.outputs.charlie }}
      oscar: ${{ steps.filter.outputs.oscar }}
      papa: ${{ steps.filter.outputs.papa }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            charlie:
              - 'workers/charlie/**'
              - 'workers/shared/**'
            oscar:
              - 'workers/oscar/**'
              - 'workers/shared/**'
            papa:
              - 'workers/papa/**'
              - 'workers/shared/**'

  # ─── CHARLIE ───
  build-charlie:
    needs: changes
    if: needs.changes.outputs.charlie == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: workers/charlie/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/barbarossa-charlie:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── OSCAR ───
  build-oscar:
    needs: changes
    if: needs.changes.outputs.oscar == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: workers/oscar/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/barbarossa-oscar:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── PAPA ───
  build-papa:
    needs: changes
    if: needs.changes.outputs.papa == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: workers/papa/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/barbarossa-papa:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Deploy to OVH VPS ───
  deploy:
    needs: [build-charlie, build-oscar, build-papa]
    if: |
      always() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to OVH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.OVH_HOST }}
          username: ${{ secrets.OVH_USER }}
          key: ${{ secrets.OVH_SSH_KEY }}
          script: |
            cd ~/barbarossa || { git clone https://github.com/uphiago/barbarossa.git ~/barbarossa && cd ~/barbarossa; }
            git pull
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull charlie oscar papa
            docker compose up -d --remove-orphans
            docker image prune -f

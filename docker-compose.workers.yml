# Barbarossa — OSCAR + PAPA workers (opcionais)
#
# CHARLIE está no docker-compose.yml e é o único obrigatório.
# OSCAR e PAPA são para fases avançadas.
#
# Em VPS com 4GB:
#   docker compose up -d                # só charlie + hermes
# Em máquina com 8GB+:
#   docker compose -f docker-compose.yml -f docker-compose.workers.yml --profile full up -d
#
# Uso:
#   ssh root@oscar
#   ssh root@papa
#   ssh root@papa "torsocks curl https://ifconfig.me"

services:
  oscar:
    build:
      context: .
      dockerfile: workers/oscar/Dockerfile
    container_name: oscar
    hostname: oscar
    restart: unless-stopped
    volumes:
      - ./worker/ssh-keys/authorized_keys:/ssh-keys/authorized_keys:ro
      - oscar-data:/root/output
    environment:
      - TZ=America/Sao_Paulo
    networks:
      - barbarossa-net
    profiles:
      - full

  papa:
    build:
      context: .
      dockerfile: workers/papa/Dockerfile
    container_name: papa
    hostname: papa
    restart: unless-stopped
    volumes:
      - ./worker/ssh-keys/authorized_keys:/ssh-keys/authorized_keys:ro
      - papa-data:/root/output
    environment:
      - TZ=America/Sao_Paulo
    networks:
      - barbarossa-net
    profiles:
      - full

volumes:
  oscar-data:
  papa-data:

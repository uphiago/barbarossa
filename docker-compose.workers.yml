# Barbarossa — extra workers
#
# Adiciona worker-heavy e worker-tor ao cluster.
# O worker principal ja esta no docker-compose.yml.
# Heavy e Tor sao para uso especializado.
#
# Uso:
#   docker compose -f docker-compose.yml -f docker-compose.workers.yml --profile full up -d
#   ssh -i ~/.ssh/key root@worker-heavy
#   ssh -i ~/.ssh/key root@worker-tor

services:
  worker-heavy:
    build:
      context: .
      dockerfile: workers/heavy/Dockerfile
    container_name: worker-heavy
    hostname: worker-heavy
    restart: unless-stopped
    volumes:
      - ./worker/ssh-keys/authorized_keys:/ssh-keys/authorized_keys:ro
      - worker-heavy-data:/root/output
    environment:
      - TZ=America/Sao_Paulo
    networks:
      - barbarossa-net
    profiles:
      - full

  worker-tor:
    build:
      context: .
      dockerfile: workers/tor/Dockerfile
    container_name: worker-tor
    hostname: worker-tor
    restart: unless-stopped
    volumes:
      - ./worker/ssh-keys/authorized_keys:/ssh-keys/authorized_keys:ro
      - worker-tor-data:/root/output
    environment:
      - TZ=America/Sao_Paulo
    networks:
      - barbarossa-net
    profiles:
      - full

volumes:
  worker-heavy-data:
  worker-tor-data:

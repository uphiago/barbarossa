# barbarossa + extra workers — integration compose
#
# Adiciona worker-heavy e worker-tor ao setup barbarossa existente.
# O worker original (recon) continua sendo o principal, usado pelo hermes.
# Heavy e Tor sao para uso manual ou via SSH direto.
#
# Uso:
#   docker compose -f docker-compose.yml -f docker-compose.workers.yml up -d
#   ssh -i ~/.ssh/barbarossa_key root@worker-heavy
#   ssh -i ~/.ssh/barbarossa_key root@worker-tor
#
# Tor SOCKS5 disponivel em worker-tor:9050 (precisa de VPS com acesso a rede Tor)

services:
  worker-heavy:
    build:
      context: ../../red
      dockerfile: infra/images/Dockerfile.worker-heavy
    container_name: barbarossa-worker-heavy
    hostname: barbarossa-worker-heavy
    restart: unless-stopped
    volumes:
      - ./worker/ssh-keys/authorized_keys:/ssh-keys/authorized_keys:ro
      - worker-heavy-data:/root/output
    environment:
      - TZ=America/Sao_Paulo
    networks:
      - barbarossa-net
    profiles:
      - full

  worker-tor:
    build:
      context: ../../red
      dockerfile: infra/images/Dockerfile.worker-tor
    container_name: barbarossa-worker-tor
    hostname: barbarossa-worker-tor
    restart: unless-stopped
    volumes:
      - ./worker/ssh-keys/authorized_keys:/ssh-keys/authorized_keys:ro
      - worker-tor-data:/root/output
    environment:
      - TZ=America/Sao_Paulo
    networks:
      - barbarossa-net
    profiles:
      - full

volumes:
  worker-heavy-data:
  worker-tor-data:
